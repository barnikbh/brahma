nodes:
  # ---------------------------------------------------------------- findings
  - nodeId: IBD-N1
    type: symptom
    label: Bloody diarrhoea
    content: >-
      Loose stools with visible blood are a cardinal presenting feature of ulcerative
      colitis and should prompt assessment for inflammatory bowel disease as well as
      for an infective cause.
    fields:
      name: bloody diarrhoea
      synonyms: [bloody stool, bloody stools, blood in stool, rectal bleeding with diarrhoea]
    sourceIds: [IBD-S2, IBD-S8]
    column: findings
  - nodeId: IBD-N2
    type: symptom
    label: Abdominal pain
    content: >-
      Abdominal pain, often with diarrhoea, is a common presenting complaint in Crohn's
      disease and is one reason to look for bowel inflammation.
    fields:
      name: abdominal pain
      synonyms: [abdominal cramps, belly pain, tummy pain]
    sourceIds: [IBD-S6, IBD-S8]
    column: findings
  - nodeId: IBD-N3
    type: metric
    label: Haemoglobin below 10.5 g/dL
    content: >-
      A haemoglobin under 10.5 g/dL is one of the systemic toxicity markers in the
      Truelove and Witts definition of acute severe colitis. Normal lower limits by sex
      and pregnancy follow the WHO anaemia thresholds for people aged 15 and over.
    fields:
      measure: Hb
      unit: g/dL
      threshold: 10.5
      comparator: lt
      synonyms: [haemoglobin, hemoglobin]
    referenceRanges:
      - {sex: female, ageBand: "15+", low: 12, unit: g/dL}
      - {sex: female, ageBand: "15+", pregnancy: true, low: 11, unit: g/dL}
      - {sex: male, ageBand: "15+", low: 13, unit: g/dL}
    sourceIds: [IBD-S2, IBD-S11]
    column: findings
  - nodeId: IBD-N5
    type: metric
    label: Faecal calprotectin above 50 ug/g
    content: >-
      Faecal calprotectin above 50 micrograms per gram supports referral to look for
      inflammatory bowel disease in adults with recent-onset lower gastrointestinal
      symptoms when cancer is not suspected.
    fields:
      measure: calprotectin
      unit: ug/g
      threshold: 50
      comparator: gt
      synonyms: [faecal calprotectin, fecal calprotectin]
    sourceIds: [IBD-S10]
    column: findings
  - nodeId: IBD-N6
    type: metric
    label: Six or more bloody stools a day
    content: >-
      Six or more bloody stools a day, together with at least one sign of systemic
      toxicity, defines acute severe ulcerative colitis by the Truelove and Witts
      criteria.
    fields:
      measure: stool frequency
      unit: per day
      threshold: 6
      comparator: ge
      synonyms: [stools per day, bowel movements per day]
    sourceIds: [IBD-S2, IBD-S1]
    column: findings
  - nodeId: IBD-N7
    type: metric
    label: C-reactive protein above 45 mg/L
    content: >-
      On day 3 of intravenous steroids, a CRP above 45 mg/L with three to eight stools a
      day predicts a high chance of needing colectomy (the Oxford criteria).
    fields:
      measure: CRP
      unit: mg/L
      threshold: 45
      comparator: gt
      synonyms: [c-reactive protein]
    sourceIds: [IBD-S2]
    column: findings
  - nodeId: IBD-N8
    type: symptom
    label: Weight loss
    content: >-
      Unintended weight loss alongside bowel symptoms raises concern for Crohn's disease
      and for malnutrition, which should be assessed.
    fields:
      name: weight loss
      synonyms: [losing weight, unintentional weight loss]
    sourceIds: [IBD-S6, IBD-S14]
    column: findings

  # ---------------------------------------------------------------- diagnoses
  - nodeId: IBD-N10
    type: diagnosis
    label: Suspected inflammatory bowel disease
    content: >-
      Inflammatory bowel disease is suspected from symptoms and raised inflammatory
      markers. The diagnosis rests on clinical, laboratory, endoscopic and histological
      findings together, after infection has been excluded.
    fields:
      name: inflammatory bowel disease
    sourceIds: [IBD-S8, IBD-S2]
    column: diagnosis
  - nodeId: IBD-N11
    type: diagnosis
    label: Ulcerative colitis
    content: >-
      Ulcerative colitis is continuous mucosal inflammation that starts in the rectum and
      extends a variable distance up the colon. Its extent and severity guide treatment.
    fields:
      name: ulcerative colitis
      code: K51
    sourceIds: [IBD-S1, IBD-S8]
    column: diagnosis
  - nodeId: IBD-N12
    type: diagnosis
    label: Crohn's disease
    content: >-
      Crohn's disease is patchy transmural inflammation that can affect any part of the
      gut. Location, behaviour and activity guide treatment.
    fields:
      name: crohn's disease
      code: K50
    sourceIds: [IBD-S5, IBD-S8]
    column: diagnosis
  - nodeId: IBD-N13
    type: diagnosis
    label: Infectious colitis (alternative to consider)
    content: >-
      Bacterial infection, including Clostridioides difficile, can mimic a first
      presentation or a flare of inflammatory bowel disease and must be excluded with
      stool testing.
    fields:
      name: infectious colitis
    sourceIds: [IBD-S18, IBD-S8]
    column: diagnosis
    alternative: true

  # ---------------------------------------------------------------- tests
  - nodeId: IBD-N20
    type: test
    label: Stool culture and C. difficile testing
    content: >-
      Stool should be sent for bacterial culture and Clostridioides difficile toxin
      testing in suspected IBD and in every flare, to exclude infection.
    fields:
      name: stool culture
      synonyms: [stool microbiology, stool culture and c. difficile testing]
      resultOptions: [negative, positive]
    sourceIds: [IBD-S2, IBD-S8]
    column: tests
  - nodeId: IBD-N21
    type: test
    label: Ileocolonoscopy with biopsies
    content: >-
      Ileocolonoscopy with biopsies from the terminal ileum and each colonic segment is
      the key test to establish the diagnosis and to tell ulcerative colitis from Crohn's
      disease.
    fields:
      name: colonoscopy with biopsy
      synonyms: [ileocolonoscopy, colonoscopy]
      resultOptions: [ulcerative colitis, crohn's disease, normal]
    sourceIds: [IBD-S8]
    column: tests
  - nodeId: IBD-N22
    type: test
    label: Extent of ulcerative colitis (Montreal E1 to E3)
    content: >-
      The Montreal classification groups ulcerative colitis by maximal extent - E1
      proctitis, E2 left-sided disease up to the splenic flexure, E3 extensive disease
      beyond it.
    fields:
      name: disease extent
      synonyms: [uc extent, montreal extent]
      resultOptions: [E1, E2, E3]
    sourceIds: [IBD-S9]
    column: tests
  - nodeId: IBD-N23
    type: test
    label: Severity of ulcerative colitis (Truelove and Witts)
    content: >-
      Truelove and Witts grades activity as mild, moderate or severe from stool
      frequency, blood, pulse, temperature, haemoglobin and ESR. Severe disease needs
      hospital admission.
    fields:
      name: truelove and witts severity
      synonyms: [uc severity, truelove witts]
      resultOptions: [mild, moderate, severe]
    sourceIds: [IBD-S2, IBD-S1]
    column: tests
  - nodeId: IBD-N24
    type: test
    label: Location of Crohn's disease (Montreal L1 to L3)
    content: >-
      The Montreal classification records Crohn's location as L1 ileal, L2 colonic or L3
      ileocolonic, with an upper gastrointestinal modifier when present.
    fields:
      name: crohn's location
      synonyms: [montreal location]
      resultOptions: [L1, L2, L3]
    sourceIds: [IBD-S9]
    column: tests
  - nodeId: IBD-N25
    type: test
    label: Behaviour of Crohn's disease (Montreal B1 to B3)
    content: >-
      The Montreal classification records behaviour as B1 non-stricturing and
      non-penetrating, B2 stricturing or B3 penetrating, with a perianal modifier.
    fields:
      name: crohn's behaviour
      synonyms: [montreal behaviour, crohn's behavior]
      resultOptions: [B1, B2, B3]
    sourceIds: [IBD-S9]
    column: tests
  - nodeId: IBD-N26
    type: test
    label: Activity of Crohn's disease
    content: >-
      Clinical activity is graded as mild, moderate or severe from symptoms, systemic
      features and inflammatory markers, and guides the choice of induction therapy.
    fields:
      name: crohn's activity
      synonyms: [crohn's severity]
      resultOptions: [mild, moderate, severe]
    sourceIds: [IBD-S6, IBD-S5]
    column: tests

  # ---------------------------------------------------------------- sub-types
  - nodeId: IBD-N30
    type: subtype
    label: Ulcerative proctitis (E1)
    content: Inflammation limited to the rectum.
    fields: {name: ulcerative proctitis, extent: E1}
    sourceIds: [IBD-S9]
    column: subtype
  - nodeId: IBD-N31
    type: subtype
    label: Left-sided ulcerative colitis (E2)
    content: Inflammation extending no further than the splenic flexure.
    fields: {name: left-sided ulcerative colitis, extent: E2}
    sourceIds: [IBD-S9]
    column: subtype
  - nodeId: IBD-N32
    type: subtype
    label: Extensive ulcerative colitis, pancolitis (E3)
    content: Inflammation extending beyond the splenic flexure, including pancolitis.
    fields: {name: extensive ulcerative colitis, extent: E3}
    sourceIds: [IBD-S9]
    column: subtype
  - nodeId: IBD-N33
    type: subtype
    label: Ulcerative colitis, mild to moderate activity
    content: >-
      Mild to moderate ulcerative colitis is usually managed as an outpatient, with an
      aminosalicylate as first-line therapy.
    fields: {name: mild to moderate ulcerative colitis, severity: mild to moderate}
    sourceIds: [IBD-S4, IBD-S1]
    column: subtype
  - nodeId: IBD-N34
    type: subtype
    label: Acute severe ulcerative colitis
    content: >-
      Acute severe ulcerative colitis is a medical emergency. It needs admission,
      intravenous steroids, joint medical and surgical care, and an early decision on
      rescue therapy.
    fields: {name: acute severe ulcerative colitis, severity: severe}
    sourceIds: [IBD-S2, IBD-S1, IBD-S3]
    column: subtype
  - nodeId: IBD-N35
    type: subtype
    label: Ileal Crohn's disease (L1)
    content: Crohn's disease confined to the terminal ileum, with or without caecal spill-over.
    fields: {name: ileal crohn's disease, extent: L1}
    sourceIds: [IBD-S9]
    column: subtype
  - nodeId: IBD-N36
    type: subtype
    label: Colonic Crohn's disease (L2)
    content: Crohn's disease affecting the colon only.
    fields: {name: colonic crohn's disease, extent: L2}
    sourceIds: [IBD-S9]
    column: subtype
  - nodeId: IBD-N37
    type: subtype
    label: Ileocolonic Crohn's disease (L3)
    content: Crohn's disease affecting both the terminal ileum and the colon.
    fields: {name: ileocolonic crohn's disease, extent: L3}
    sourceIds: [IBD-S9]
    column: subtype
  - nodeId: IBD-N38
    type: subtype
    label: Stricturing Crohn's disease (B2)
    content: Crohn's disease with a fixed narrowing of the bowel.
    fields: {name: stricturing crohn's disease, severity: B2}
    sourceIds: [IBD-S9, IBD-S7]
    column: subtype
  - nodeId: IBD-N39
    type: subtype
    label: Penetrating Crohn's disease (B3)
    content: Crohn's disease with fistulas, inflammatory masses or abscesses.
    fields: {name: penetrating crohn's disease, severity: B3}
    sourceIds: [IBD-S9, IBD-S7]
    column: subtype

  # ---------------------------------------------------------------- treatment tiers
  - nodeId: IBD-N40
    type: treatment_tier
    label: "UC Tier 1: oral mesalamine"
    content: >-
      For mild to moderate ulcerative colitis, standard-dose oral mesalamine is
      preferred over low dose, and once-daily dosing is acceptable.
    fields:
      tier: 1
      entryCriteria: Mild to moderately active ulcerative colitis
      drugNodeIds: [IBD-N50]
    sourceIds: [IBD-S4, IBD-S1]
    column: treatment
  - nodeId: IBD-N41
    type: treatment_tier
    label: "UC Tier 2: intravenous corticosteroids"
    content: >-
      Acute severe ulcerative colitis is treated in hospital with intravenous
      hydrocortisone or methylprednisolone, with response formally assessed on day 3.
    fields:
      tier: 2
      entryCriteria: >-
        Acute severe ulcerative colitis - six or more bloody stools a day plus at least
        one sign of systemic toxicity (Truelove and Witts)
      drugNodeIds: [IBD-N51, IBD-N52]
    sourceIds: [IBD-S2, IBD-S1, IBD-S3]
    column: treatment
  - nodeId: IBD-N42
    type: treatment_tier
    label: "UC Tier 3: rescue or advanced therapy"
    content: >-
      If intravenous steroids fail by day 3, rescue therapy with infliximab (or
      ciclosporin) or colectomy is considered. Ustekinumab is an option for moderate to
      severe disease outside the acute rescue setting.
    fields:
      tier: 3
      entryCriteria: >-
        No adequate response to intravenous steroids by day 3, or moderate to severe
        disease not controlled by conventional therapy
      drugNodeIds: [IBD-N53, IBD-N54]
    sourceIds: [IBD-S1, IBD-S2, IBD-S19]
    column: treatment
  - nodeId: IBD-N43
    type: treatment_tier
    label: "Crohn's Tier 1: oral budesonide"
    content: >-
      Controlled-release budesonide is used to induce remission in mild to moderate
      Crohn's disease of the ileum or ileocaecal region.
    fields:
      tier: 1
      entryCriteria: Mild to moderate ileal or ileocaecal Crohn's disease
      drugNodeIds: [IBD-N55]
    sourceIds: [IBD-S5, IBD-S6]
    column: treatment
  - nodeId: IBD-N44
    type: treatment_tier
    label: "Crohn's Tier 2: anti-TNF therapy"
    content: >-
      Anti-TNF therapy such as infliximab is used for moderate to severe Crohn's disease
      and when conventional therapy has failed.
    fields:
      tier: 2
      entryCriteria: Moderate to severe Crohn's disease, or failure of first-line therapy
      drugNodeIds: [IBD-N53]
    sourceIds: [IBD-S5, IBD-S6]
    column: treatment
  - nodeId: IBD-N45
    type: treatment_tier
    label: "Crohn's Tier 3: ustekinumab"
    content: >-
      Ustekinumab is an option for moderate to severe Crohn's disease with an inadequate
      response to, or intolerance of, anti-TNF therapy.
    fields:
      tier: 3
      entryCriteria: >-
        Moderate to severe Crohn's disease with inadequate response to, or intolerance
        of, anti-TNF therapy
      drugNodeIds: [IBD-N54]
    sourceIds: [IBD-S5]
    column: treatment

  # ---------------------------------------------------------------- drugs
  - nodeId: IBD-N50
    type: drug
    label: Mesalamine, oral, standard dose
    content: >-
      Oral mesalamine at a standard dose of 2 to 3 g a day induces and maintains
      remission in mild to moderate ulcerative colitis. A once-daily regimen is
      acceptable.
    fields:
      drug: mesalamine
      synonyms: [mesalazine, 5-asa, 5-aminosalicylic acid]
      drugClass: aminosalicylate
      route: oral
      doseValue: 2
      doseUnit: g
      doseBasis: absolute
      rounding: standard-dose range is 2 to 3 g a day
      frequency: once daily
      duration: continue as maintenance once remission is achieved
      contraindications: [salicylate hypersensitivity, severe renal impairment]
    sourceIds: [IBD-S4]
    column: treatment
  - nodeId: IBD-N51
    type: drug
    label: Hydrocortisone 100 mg IV four times daily
    content: >-
      Intravenous hydrocortisone 100 mg four times a day is a first-line steroid regimen
      for acute severe ulcerative colitis, with response reviewed on day 3.
    fields:
      drug: hydrocortisone
      synonyms: [iv hydrocortisone]
      drugClass: corticosteroid
      route: intravenous
      doseValue: 100
      doseUnit: mg
      doseBasis: absolute
      rounding: not applicable (fixed dose)
      frequency: four times daily
      duration: until response is assessed on day 3
      contraindications: [untreated systemic infection]
    sourceIds: [IBD-S2]
    column: treatment
  - nodeId: IBD-N52
    type: drug
    label: Methylprednisolone 60 mg IV once daily
    content: >-
      Intravenous methylprednisolone 60 mg once every 24 hours is an alternative steroid
      regimen for acute severe ulcerative colitis, with response reviewed on day 3.
    fields:
      drug: methylprednisolone
      synonyms: [iv methylprednisolone, solumedrol]
      drugClass: corticosteroid
      route: intravenous
      doseValue: 60
      doseUnit: mg
      doseBasis: absolute
      rounding: not applicable (fixed dose)
      frequency: once daily
      duration: until response is assessed on day 3
      contraindications: [untreated systemic infection]
    sourceIds: [IBD-S2]
    column: treatment
  - nodeId: IBD-N53
    type: drug
    label: Infliximab 5 mg/kg IV
    content: >-
      Infliximab is given intravenously at 5 mg per kg at weeks 0, 2 and 6, then every
      8 weeks as maintenance. A single infusion is used as rescue in acute severe
      ulcerative colitis. Screen for tuberculosis and hepatitis B first.
    fields:
      drug: infliximab
      synonyms: [remicade, anti-tnf infliximab]
      drugClass: anti-TNF monoclonal antibody
      route: intravenous
      doseValue: 5
      doseUnit: mg/kg
      doseBasis: per_kg
      rounding: none specified by the cited guidelines
      frequency: weeks 0, 2 and 6, then every 8 weeks
      duration: maintenance continued while the patient responds
      contraindications:
        - active tuberculosis or other serious infection
        - moderate to severe heart failure
    sourceIds: [IBD-S1, IBD-S5, IBD-S6]
    column: treatment
  - nodeId: IBD-N54
    type: drug
    label: Ustekinumab 90 mg SC maintenance
    content: >-
      Ustekinumab starts with one weight-based intravenous induction dose of about 6 mg
      per kg, then 90 mg is given under the skin every 8 weeks as maintenance.
    fields:
      drug: ustekinumab
      synonyms: [stelara]
      drugClass: anti-IL-12/23 monoclonal antibody
      route: subcutaneous
      doseValue: 90
      doseUnit: mg
      doseBasis: absolute
      rounding: not applicable (fixed maintenance dose)
      frequency: every 8 weeks after a single weight-based intravenous induction dose
      duration: maintenance continued while the patient responds
      contraindications: [clinically important active infection, active tuberculosis]
    sourceIds: [IBD-S5, IBD-S19]
    column: treatment
  - nodeId: IBD-N55
    type: drug
    label: Budesonide 9 mg oral once daily
    content: >-
      Controlled-release budesonide 9 mg once a day induces remission in mild to
      moderate ileocaecal Crohn's disease. It is not recommended for maintenance.
    fields:
      drug: budesonide
      synonyms: [controlled ileal release budesonide, entocort]
      drugClass: corticosteroid
      route: oral
      doseValue: 9
      doseUnit: mg
      doseBasis: absolute
      rounding: not applicable (fixed dose)
      frequency: once daily
      duration: induction course only; not recommended for maintenance of remission
      contraindications: [untreated systemic infection]
    sourceIds: [IBD-S6, IBD-S5]
    column: treatment
  - nodeId: IBD-N56
    type: drug
    label: Levothyroxine (comorbidity medicine)
    content: >-
      For full replacement in hypothyroidism the usual levothyroxine dose is about 1.6
      micrograms per kg a day, started lower in older adults or those with heart
      disease. It is taken on an empty stomach, apart from calcium and iron.
    fields:
      drug: levothyroxine
      synonyms: [thyroxine, l-thyroxine]
      drugClass: thyroid hormone
      route: oral
      doseValue: 1.6
      doseUnit: ug/kg
      doseBasis: per_kg
      rounding: none specified by the cited guideline
      frequency: once daily
      duration: long-term replacement
      contraindications: [untreated adrenal insufficiency, untreated thyrotoxicosis]
    sourceIds: [IBD-S16]
    column: treatment

  # ---------------------------------------------------------------- diet
  - nodeId: IBD-N60
    type: diet
    label: Diet in ulcerative colitis
    content: >-
      No particular diet has been shown to induce or maintain remission in ulcerative
      colitis. Screen for malnutrition and give individual dietary advice.
    fields:
      advice: >-
        Screen for malnutrition and give individual advice; no specific diet is proven to
        control ulcerative colitis
    sourceIds: [IBD-S14]
    column: treatment
  - nodeId: IBD-N61
    type: diet
    label: Exclusive enteral nutrition in Crohn's disease
    content: >-
      Exclusive enteral nutrition is a first-line way to induce remission in children
      with active Crohn's disease and can be considered in adults.
    fields:
      advice: >-
        Consider exclusive enteral nutrition to induce remission, especially in children
    sourceIds: [IBD-S14]
    column: treatment

  # ---------------------------------------------------------------- monitoring
  - nodeId: IBD-N70
    type: monitoring
    label: Stool frequency on intravenous steroids
    content: >-
      Record stool frequency every day on intravenous steroids. More than 8 stools a day
      on day 3 predicts that colectomy is likely.
    fields:
      measure: stool frequency
      unit: per day
      threshold: 8
      comparator: gt
      interval: daily, with formal review on day 3
    sourceIds: [IBD-S2]
    column: monitor
  - nodeId: IBD-N71
    type: monitoring
    label: CRP on intravenous steroids
    content: >-
      Check CRP during intravenous steroid treatment. On day 3, a CRP above 45 mg/L with
      three to eight stools a day predicts that colectomy is likely.
    fields:
      measure: CRP
      unit: mg/L
      threshold: 45
      comparator: gt
      interval: daily, with formal review on day 3
    sourceIds: [IBD-S2]
    column: monitor
  - nodeId: IBD-N72
    type: monitoring
    label: Infliximab trough level
    content: >-
      When an anti-TNF stops working, a trough level helps decide the next step. For
      infliximab, a trough of at least 5 micrograms per mL is the suggested target.
    fields:
      measure: infliximab trough level
      unit: ug/mL
      threshold: 5
      comparator: ge
      interval: reactive testing when response is lost
    sourceIds: [IBD-S13]
    column: monitor

  # ---------------------------------------------------------------- response criteria
  - nodeId: IBD-N80
    type: response_criterion
    label: "Day 3 on IV steroids: more than 8 stools a day"
    content: >-
      More than 8 stools a day on day 3 of intravenous steroids means the patient is not
      responding, and rescue therapy or surgery should be discussed.
    fields:
      tier: 2
      measure: stool frequency
      unit: per day
      threshold: 8
      comparator: gt
      verdict: not_responding
    sourceIds: [IBD-S2]
    column: monitor
  - nodeId: IBD-N81
    type: response_criterion
    label: "Day 3 on IV steroids: CRP above 45 mg/L"
    content: >-
      A CRP above 45 mg/L on day 3 with three to eight stools a day means the patient is
      not responding, and rescue therapy or surgery should be discussed.
    fields:
      tier: 2
      measure: CRP
      unit: mg/L
      threshold: 45
      comparator: gt
      verdict: not_responding
    sourceIds: [IBD-S2]
    column: monitor
  - nodeId: IBD-N82
    type: response_criterion
    label: "UC Tier 1 target: calprotectin 250 ug/g or below"
    content: >-
      A fall in faecal calprotectin to an acceptable range, up to 250 micrograms per
      gram, is an intermediate treatment target.
    fields:
      tier: 1
      measure: calprotectin
      unit: ug/g
      threshold: 250
      comparator: le
      verdict: responding
    sourceIds: [IBD-S12]
    column: monitor
  - nodeId: IBD-N83
    type: response_criterion
    label: "UC Tier 3 target: calprotectin 250 ug/g or below"
    content: >-
      A fall in faecal calprotectin to an acceptable range, up to 250 micrograms per
      gram, is an intermediate treatment target.
    fields:
      tier: 3
      measure: calprotectin
      unit: ug/g
      threshold: 250
      comparator: le
      verdict: responding
    sourceIds: [IBD-S12]
    column: monitor
  - nodeId: IBD-N84
    type: response_criterion
    label: "Crohn's Tier 1 target: calprotectin 250 ug/g or below"
    content: >-
      A fall in faecal calprotectin to an acceptable range, up to 250 micrograms per
      gram, is an intermediate treatment target.
    fields:
      tier: 1
      measure: calprotectin
      unit: ug/g
      threshold: 250
      comparator: le
      verdict: responding
    sourceIds: [IBD-S12]
    column: monitor
  - nodeId: IBD-N85
    type: response_criterion
    label: "Crohn's Tier 2 target: calprotectin 250 ug/g or below"
    content: >-
      A fall in faecal calprotectin to an acceptable range, up to 250 micrograms per
      gram, is an intermediate treatment target.
    fields:
      tier: 2
      measure: calprotectin
      unit: ug/g
      threshold: 250
      comparator: le
      verdict: responding
    sourceIds: [IBD-S12]
    column: monitor
  - nodeId: IBD-N86
    type: response_criterion
    label: "Crohn's Tier 3 target: calprotectin 250 ug/g or below"
    content: >-
      A fall in faecal calprotectin to an acceptable range, up to 250 micrograms per
      gram, is an intermediate treatment target.
    fields:
      tier: 3
      measure: calprotectin
      unit: ug/g
      threshold: 250
      comparator: le
      verdict: responding
    sourceIds: [IBD-S12]
    column: monitor

  # ---------------------------------------------------------------- watch-outs
  - nodeId: IBD-N90
    type: watch_out
    label: Toxic megacolon
    content: >-
      Colonic dilatation with systemic toxicity in acute severe colitis is a surgical
      emergency that needs urgent joint medical and surgical review.
    fields:
      sign: colonic dilatation on abdominal imaging with systemic toxicity
      action: urgent joint medical and surgical review
    sourceIds: [IBD-S2, IBD-S1]
    column: monitor
  - nodeId: IBD-N91
    type: watch_out
    label: Venous thromboembolism risk in hospital
    content: >-
      Active inflammatory bowel disease raises the risk of clots. Inpatients should get
      pharmacological thromboprophylaxis unless there is a contraindication, even with
      rectal bleeding.
    fields:
      sign: hospital admission with active inflammatory bowel disease
      action: give low-molecular-weight heparin prophylaxis unless contraindicated
    sourceIds: [IBD-S2]
    column: monitor
  - nodeId: IBD-N92
    type: watch_out
    label: Screen for infection before biologics
    content: >-
      Before anti-TNF or other biologic therapy, screen for latent tuberculosis and for
      hepatitis B, and review vaccination status.
    fields:
      sign: planned anti-TNF or other biologic therapy
      action: screen for latent tuberculosis and hepatitis B before the first dose
    sourceIds: [IBD-S15]
    column: monitor
  - nodeId: IBD-N93
    type: watch_out
    label: Abscess in penetrating Crohn's disease
    content: >-
      An intra-abdominal abscess should be drained or treated before anti-TNF therapy is
      started, using imaging-guided drainage where possible.
    fields:
      sign: penetrating Crohn's disease with suspected intra-abdominal abscess
      action: drain or treat the abscess before starting anti-TNF therapy
    sourceIds: [IBD-S7]
    column: monitor
  - nodeId: IBD-N94
    type: watch_out
    label: Exclude infection at presentation and in flares
    content: >-
      New or worsening bloody diarrhoea needs stool tests for bacterial pathogens and
      Clostridioides difficile before IBD treatment is escalated.
    fields:
      sign: new or worsening bloody diarrhoea
      action: send stool tests for bacterial pathogens and C. difficile toxin
    sourceIds: [IBD-S2, IBD-S8]
    column: monitor

  # ---------------------------------------------------------------- surgery triggers
  - nodeId: IBD-N95
    type: escalation
    label: No response to rescue therapy
    content: >-
      If rescue therapy does not bring improvement within 4 to 7 days, colectomy should
      be recommended rather than further delay.
    fields:
      trigger: no improvement within 4 to 7 days of rescue therapy
      action: discuss colectomy with a colorectal surgeon
    sourceIds: [IBD-S1, IBD-S2]
    column: monitor
  - nodeId: IBD-N96
    type: escalation
    label: Emergency colectomy triggers
    content: >-
      Toxic megacolon that does not settle, perforation or major bleeding in acute
      severe colitis are reasons for emergency colectomy.
    fields:
      trigger: toxic megacolon not settling, perforation or major haemorrhage
      action: emergency colectomy
    sourceIds: [IBD-S2]
    column: monitor
  - nodeId: IBD-N97
    type: escalation
    label: Symptomatic Crohn's stricture
    content: >-
      A short, accessible stricture causing symptoms can be treated by endoscopic balloon
      dilation. Longer or complex strictures need surgical resection or stricturoplasty.
    fields:
      trigger: symptomatic stricture despite medical therapy
      action: endoscopic balloon dilation for short strictures, otherwise surgery
    sourceIds: [IBD-S7]
    column: monitor
  - nodeId: IBD-N98
    type: escalation
    label: Limited ileocaecal Crohn's disease
    content: >-
      For limited ileocaecal Crohn's disease without response to conventional therapy,
      laparoscopic ileocaecal resection is a reasonable alternative to biologic therapy.
    fields:
      trigger: limited ileocaecal disease not responding to conventional therapy
      action: discuss laparoscopic ileocaecal resection as an alternative to biologics
    sourceIds: [IBD-S7]
    column: monitor

  # ---------------------------------------------------------------- safety
  - nodeId: IBD-N100
    type: interaction
    label: Levothyroxine with calcium or iron salts
    content: >-
      Calcium and iron preparations reduce levothyroxine absorption, so the doses should
      be taken separately.
    fields:
      a: levothyroxine
      b: calcium or iron salts
      severity: moderate
    sourceIds: [IBD-S16]
    column: monitor
  - nodeId: IBD-N101
    type: allergy_cross_reactivity
    label: Penicillin allergy
    content: >-
      With a penicillin allergy label, avoid penicillins until the allergy has been
      assessed. Cross-reactivity with cephalosporins is low, especially when their side
      chains differ.
    fields:
      allergenClass: penicillin
      conflictingDrugClasses: [penicillin]
    sourceIds: [IBD-S17]
    column: monitor

  # ------------------------------------- ulcerative colitis after anti-TNF failure (v1.1)
  - nodeId: IBD-N46
    type: treatment_tier
    label: "UC after anti-TNF failure: check levels, then switch"
    content: >-
      When an anti-TNF gives no primary response, loses its effect or is not tolerated,
      check the drug trough level and anti-drug antibodies to guide the next step. With
      adequate levels, change to another class: ustekinumab, vedolizumab or a JAK
      inhibitor such as tofacitinib. Low levels or antibodies after a loss of response
      can instead support optimising or changing to a second anti-TNF.
    fields:
      tier: 3
      entryCriteria: Ulcerative colitis with primary non-response, loss of response or intolerance to anti-TNF therapy
      drugNodeIds: [IBD-N54, IBD-N57, IBD-N58]
    sourceIds: [IBD-S1, IBD-S13, IBD-S19]
    column: treatment
  - nodeId: IBD-N57
    type: drug
    label: Vedolizumab 300 mg IV
    content: >-
      Vedolizumab is a gut-selective anti-integrin antibody. It is infused at 300 mg at
      weeks 0, 2 and 6, then every 8 weeks, and is an option after anti-TNF failure,
      although it may take longer to work.
    fields:
      drug: vedolizumab
      synonyms: [entyvio]
      drugClass: anti-integrin monoclonal antibody
      route: intravenous
      doseValue: 300
      doseUnit: mg
      doseBasis: absolute
      rounding: not applicable (fixed dose)
      frequency: weeks 0, 2 and 6, then every 8 weeks
      duration: maintenance continued while the patient responds
      contraindications:
        - active severe infection, such as tuberculosis or sepsis
        - opportunistic infection, such as progressive multifocal leukoencephalopathy
    sourceIds: [IBD-S1, IBD-S19]
    column: treatment
  - nodeId: IBD-N58
    type: drug
    label: Tofacitinib 10 mg oral twice daily (induction)
    content: >-
      Tofacitinib is an oral JAK inhibitor for moderate to severe ulcerative colitis,
      including after anti-TNF failure. Induction is 10 mg twice daily for 8 weeks,
      followed by a lower maintenance dose once the colitis responds.
    fields:
      drug: tofacitinib
      synonyms: [xeljanz]
      drugClass: JAK inhibitor
      route: oral
      doseValue: 10
      doseUnit: mg
      doseBasis: absolute
      rounding: not applicable (fixed dose)
      frequency: twice daily
      duration: 8 weeks of induction, then a lower maintenance dose (5 mg twice daily)
      contraindications:
        - active serious infection, including tuberculosis
        - severe hepatic impairment
        - pregnancy or breastfeeding
    sourceIds: [IBD-S1, IBD-S19, IBD-S20]
    column: treatment
  - nodeId: IBD-N99
    type: escalation
    label: Steroid-refractory colitis after anti-TNF failure
    content: >-
      When the colitis does not respond to corticosteroids and anti-TNF therapy has
      already failed, discuss colectomy with a colorectal surgeon early, alongside any
      further medical option.
    fields:
      trigger: no response to corticosteroids after anti-TNF failure
      action: early joint review with a colorectal surgeon to discuss colectomy
    sourceIds: [IBD-S1, IBD-S2]
    column: monitor
  - nodeId: IBD-N102
    type: watch_out
    label: Steroids only as a bridge when switching
    content: >-
      When the colitis responds to corticosteroids, use them only as a short bridge
      until the new maintenance treatment takes effect, then taper them off. They are
      not a long-term maintenance therapy.
    fields:
      sign: colitis responding to corticosteroids during the switch
      action: use corticosteroids only as a short bridge to the new maintenance treatment, then taper them off
    sourceIds: [IBD-S1, IBD-S2]
    column: monitor
  - nodeId: IBD-N103
    type: watch_out
    label: "Before a JAK inhibitor: clot and heart risk"
    content: >-
      Before tofacitinib, review the risk of venous thromboembolism and of major
      cardiovascular events, especially in people aged 50 or over with risk factors,
      and consider shingles vaccination.
    fields:
      sign: planned tofacitinib or another JAK inhibitor
      action: review thrombosis and cardiovascular risk and herpes zoster vaccination before starting
    sourceIds: [IBD-S20, IBD-S1]
    column: monitor

  # ------------------------------------------------------------ care loop (v1.2)
  - nodeId: IBD-N110
    type: test
    label: Latent tuberculosis screen before a biologic
    content: >-
      Before the first dose of an anti-TNF, other biologic or JAK inhibitor, test for
      latent tuberculosis. Repeat it for each new course of treatment.
    fields:
      name: latent tuberculosis screen
      synonyms: [tb screen, tb test, igra, tuberculosis screening]
      resultOptions: [negative, positive]
    sourceIds: [IBD-S15]
    column: tests
  - nodeId: IBD-N111
    type: test
    label: Hepatitis B screen before a biologic
    content: >-
      Before the first dose of an anti-TNF, other biologic or JAK inhibitor, test for
      hepatitis B infection. A positive result needs specialist advice before starting.
    fields:
      name: hepatitis b screen
      synonyms: [hbv screen, hepatitis b serology, hepatitis b test]
      resultOptions: [negative, positive]
    sourceIds: [IBD-S15]
    column: tests

