# Brahma IBD knowledge pack v1.2. Decision support, not diagnosis.
# v1.2 turns the pathway into a care loop: pre-biologic infection screens are tests that
# a treatment requires, and two watch-outs lead on when the patient has the sign.
# Drug-specific monitoring and watch-outs hang off the drug (infliximab trough level,
# tofacitinib clot risk); risks of acute severe UC hang off that state, not the tier.
# v1.1 adds the ulcerative colitis path after anti-TNF failure (treatment history).
# Paraphrased from the cited guidelines (no verbatim copying) and drafted with Claude for
# clinical review. Contains no patient data. Every node cites at least one source below.
# Values not confidently attributable to a cited guideline were left out, not guessed;
# see the code summary for the reviewer list.
pack:
  code: IBD
  name: Inflammatory bowel disease
  specialty: Gastroenterology
version: "1.2"
changeSummary: Care loop - tuberculosis and hepatitis B screens as tests required before a biologic or JAK inhibitor; toxic megacolon leads to colectomy review; new bloody diarrhoea repeats the stool tests; drug-specific monitoring and watch-outs moved from tiers to their drug, acute severe UC risks to that state. Earlier in v1.1, ulcerative colitis after anti-TNF failure - drug levels, switching class (ustekinumab, vedolizumab, tofacitinib), steroids as a bridge and steroid-refractory escalation

